<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0e10" />
    <title></title>
    <style>
      :root {
        --ink: #0d0e10;
        --rail: rgba(29, 30, 32, .7);
        --panel: rgba(29, 30, 32, .68);
        --line: rgba(255, 255, 255, .16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, .58);
        --soft: rgba(245, 245, 245, .1);
        --accent: #f5f5f5;
        --glass-surface: rgba(29, 30, 32, .56);
        --glass-surface-strong: rgba(29, 30, 32, .76);
        --glass-control: rgba(255, 255, 255, .08);
        --glass-control-hover: rgba(255, 255, 255, .15);
        --glass-border: rgba(255, 255, 255, .2);
        --glass-highlight: rgba(255, 255, 255, .16);
        --glass-shadow: 0 18px 42px rgba(0, 0, 0, .24);
        --map-background: #0b0c0e;
        --map-atmosphere: #9da2a8;
        --map-point: #f5f5f5;
        --map-path: rgba(255, 255, 255, .96);
        --ease-out: cubic-bezier(.23, 1, .32, 1);
        --ease-in-out: cubic-bezier(.77, 0, .175, 1);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: -apple-system, "SF UI Text", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      button, input { font: inherit; }
      button { color: inherit; }
      #globe { width: 100%; height: 100%; touch-action: none; }

      .side-rail { position: fixed; z-index: 5; left: 50%; bottom: 24px; width: auto; height: 58px; display: flex; align-items: center; transform: translateX(-50%); background: var(--rail); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.28); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .rail-brand { display: none; }
      .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.72); color: var(--accent); border-radius: 8px; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .rail-group { display: flex; align-items: center; padding: 4px; }
      .tool-button { position: relative; width: 46px; height: 46px; margin: 0 2px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; opacity: .68; transition: opacity .2s, background .2s, color .2s, transform .14s var(--ease-out); }
      .tool-button:hover, .tool-button.active { color: var(--accent); opacity: 1; background: rgba(255,255,255,.12); border-radius: 9px; }
      .tool-button.active::before { content: ""; position: absolute; bottom: -5px; width: 18px; height: 2px; border-radius: 2px; background: var(--accent); }
      .tool-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .tool-button .tool-label { position: absolute; left: 50%; bottom: 52px; display: none; transform: translateX(-50%); white-space: nowrap; padding: 7px 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .tool-button:hover .tool-label { display: block; }

      .live-status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .live-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.15); }

      .map-tools { position: fixed; z-index: 4; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
      .map-tool { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: rgba(17,18,20,.66); color: rgba(255,255,255,.82); cursor: pointer; font-size: 19px; line-height: 1; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .14s var(--ease-out), color .2s, border-color .2s, background .2s; }
      .map-tool:hover { color: var(--accent); border-color: rgba(255,255,255,.7); }
      .map-tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      .search-panel { position: fixed; z-index: 6; left: 50%; bottom: 88px; top: auto; width: min(360px, calc(100vw - 40px)); transform: translateX(-50%); padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .search-panel[hidden], .filter-panel[hidden], .stats-panel[hidden] { display: none; }
      .search-panel:not([hidden]), .filter-panel:not([hidden]), .stats-panel:not([hidden]) { animation: floating-panel-in .18s var(--ease-out) both; }
      @keyframes floating-panel-in { from { opacity: 0; transform: translateX(-50%) translateY(7px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
      .search-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .search-input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: 0; background: rgba(0,0,0,.2); color: var(--text); font-size: 13px; }
      .search-input:focus { border-color: rgba(255,255,255,.72); }
      .search-results { margin-top: 8px; max-height: 220px; overflow: auto; }
      .search-result { width: 100%; padding: 9px 8px; display: flex; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid rgba(255,255,255,.08); border-radius: 7px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
      .search-result:hover { background: rgba(255,255,255,.1); }
      .search-result small { color: var(--muted); font-size: 11px; }
      .search-empty { padding: 12px 8px; color: var(--muted); font-size: 12px; }

      .filter-panel, .stats-panel { position: fixed; z-index: 4; left: 50%; bottom: 88px; transform: translateX(-50%); width: min(300px, calc(100vw - 40px)); padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .stats-panel { width: min(340px, calc(100vw - 40px)); }
      .stats-context { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: -4px 0 12px; color: var(--muted); font-size: 11px; }
      .stats-context strong { color: var(--text); font-size: 12px; font-weight: 500; }
      .panel-kicker { margin-bottom: 12px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .filter-field { display: block; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
      .country-picker { position: relative; margin-top: 7px; }
      .country-picker-trigger { width: 100%; height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 9px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: 0; background: rgba(0,0,0,.2); color: var(--text); cursor: pointer; font-size: 13px; text-align: left; }
      .country-picker-trigger:hover, .country-picker-trigger[aria-expanded="true"] { border-color: rgba(255,255,255,.72); }
      .country-picker-chevron { color: var(--muted); font-size: 16px; line-height: 1; }
      .country-picker-menu { position: absolute; z-index: 8; bottom: calc(100% + 6px); left: 0; right: 0; max-height: min(240px, 40vh); overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 9px; background: rgba(29,30,32,.98); box-shadow: 0 14px 30px rgba(0,0,0,.4); scrollbar-color: rgba(255,255,255,.3) transparent; }
      .country-picker-menu[hidden] { display: none; }
      .country-picker-option { width: 100%; min-height: 32px; display: block; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; color: rgba(245,245,245,.78); cursor: pointer; font-size: 12px; text-align: left; }
      .country-picker-option:hover, .country-picker-option[aria-selected="true"] { background: rgba(255,255,255,.12); color: var(--text); }
      .filter-select-native { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; opacity: 0; pointer-events: none; }
      .filter-check { display: flex; align-items: center; gap: 8px; color: rgba(244,244,241,.78); font-size: 12px; cursor: pointer; }
      .filter-check input { accent-color: var(--accent); }
      .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.1); }
      .filter-count { color: var(--muted); font-size: 11px; }
      .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .stat-item { min-width: 0; padding: 9px 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: rgba(255,255,255,.045); }
      .stat-item strong { display: block; color: var(--text); font-size: 17px; font-weight: 500; }
      .stat-item span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; white-space: nowrap; }
      .stats-title { margin: 14px 0 7px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
      .top-city { width: 100%; display: block; padding: 8px 0 9px; border: 0; border-bottom: 1px solid rgba(255,255,255,.08); background: transparent; color: rgba(244,244,241,.82); cursor: pointer; font-size: 12px; text-align: left; }
      .top-city:last-child { border-bottom: 0; }
      .top-city:hover, .top-city:focus-visible { color: var(--text); outline: 0; }
      .top-city-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .top-city small { color: var(--muted); font-size: 11px; }
      .top-city-bar { height: 4px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.1); }
      .top-city-bar span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); opacity: .72; transition: width .35s var(--ease-out); }
      .stats-empty { padding: 12px 0 4px; color: var(--muted); font-size: 12px; }

      .selection { position: fixed; z-index: 4; left: 50%; bottom: 88px; width: min(350px, calc(100vw - 40px)); transform: translateX(-50%); display: none; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .selection.visible { display: block; animation: floating-panel-in .18s var(--ease-out) both; }
      .selection.is-updating .selection-kicker,
      .selection.is-updating #selected-name,
      .selection.is-updating #selected-description,
      .selection.is-updating .office-list-panel,
      .selection.is-updating .selection-meta,
      .selection.is-updating .actions { animation: selection-content-in .28s var(--ease-out) both; }
      .selection.is-updating #selected-name { animation-delay: .025s; }
      .selection.is-updating #selected-description { animation-delay: .05s; }
      .selection.is-updating .office-list-panel { animation-delay: .075s; }
      .selection.is-updating .selection-meta { animation-delay: .1s; }
      .selection.is-updating .actions { animation-delay: .125s; }
      @keyframes selection-content-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .selection-kicker { color: var(--accent); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .selection strong { display: block; margin: 7px 0 4px; color: var(--text); font-size: 21px; font-weight: 500; }
      .selection p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .selection-meta { display: flex; gap: 16px; margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.1); color: var(--muted); font-size: 11px; }
      .office-list-panel { margin-top: 15px; padding-top: 13px; border-top: 1px solid rgba(255,255,255,.1); }
      .office-list-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: rgba(245,245,245,.82); font-size: 12px; }
      .office-list-count { color: var(--muted); font-size: 11px; }
      .office-list-search { width: 100%; height: 32px; padding: 0 9px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: 0; background: rgba(0,0,0,.2); color: var(--text); font-size: 12px; }
      .office-list-search:focus { border-color: rgba(255,255,255,.72); }
      .office-list { max-height: 208px; margin-top: 7px; overflow: auto; scrollbar-color: rgba(255,255,255,.3) transparent; }
      .office-list-item { width: 100%; min-height: 37px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 9px; border: 0; border-bottom: 1px solid rgba(255,255,255,.07); border-radius: 7px; background: transparent; color: rgba(245,245,245,.82); text-align: left; cursor: pointer; font-size: 12px; line-height: 1.35; }
      .office-list-item:last-child { border-bottom: 0; }
      .office-list-item:hover, .office-list-item.active { background: rgba(255,255,255,.1); color: var(--text); }
      .office-list-item span:first-child { min-width: 0; overflow-wrap: anywhere; }
      .office-list-badge { flex: 0 0 auto; padding: 3px 5px; border: 1px solid rgba(255,255,255,.2); border-radius: 5px; color: var(--muted); font-size: 9px; white-space: nowrap; }
      .office-list-empty { padding: 12px 8px; color: var(--muted); font-size: 11px; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      .action-button { height: 30px; padding: 0 11px; border: 1px solid rgba(255,255,255,.56); border-radius: 8px; background: rgba(255,255,255,.06); color: var(--accent); cursor: pointer; font-size: 12px; transition: transform .14s var(--ease-out), background .2s, border-color .2s; }
      .action-button:hover { background: rgba(255,255,255,.14); }
      .country-picker-trigger,
      .country-picker-option,
      .search-result,
      .office-list-item,
      .top-city,
      .knowledge-close,
      .knowledge-toc-toggle { transition: transform .14s var(--ease-out), background .2s, color .2s, border-color .2s; }
      .tool-button:active,
      .map-tool:active,
      .action-button:active,
      .country-picker-trigger:active,
      .country-picker-option:active,
      .search-result:active,
      .office-list-item:active,
      .top-city:active,
      .knowledge-close:active,
      .knowledge-toc-toggle:active { transform: scale(.97); }
      .map-status { position: fixed; z-index: 3; left: 50%; bottom: 78px; transform: translateX(-50%); color: rgba(255,255,255,.45); font-size: 11px; pointer-events: none; }

      .knowledge-reader { position: fixed; z-index: 20; inset: 0; display: block; background: #111315; color: #eceeea; overflow: hidden; opacity: 0; transform: translateY(12px); transition: opacity .24s ease, transform .28s ease; }
      .knowledge-reader.is-visible { opacity: 1; transform: translateY(0); }
      .knowledge-reader.is-closing { opacity: 0; transform: translateY(12px); }
      .knowledge-reader[hidden] { display: none; }
      .knowledge-topbar { position: relative; z-index: 32; height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.16); background: rgba(29,30,32,.68); box-shadow: 0 12px 28px rgba(0,0,0,.2); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .knowledge-topbar-leading { min-width: 0; display: flex; align-items: center; gap: 14px; }
      .knowledge-toc-toggle { display: none; width: 34px; height: 34px; align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 9px; background: rgba(255,255,255,.07); color: rgba(244,245,241,.86); cursor: pointer; }
      .knowledge-toc-toggle:hover, .knowledge-toc-toggle[aria-expanded="true"] { background: rgba(255,255,255,.14); }
      .knowledge-toc-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .knowledge-close { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 9px; background: rgba(255,255,255,.07); color: #f4f5f1; cursor: pointer; }
      .knowledge-close svg { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
      .knowledge-close:hover { background: rgba(255,255,255,.14); }
      .knowledge-progress { position: absolute; z-index: 1; top: 57px; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,.08); }
      .knowledge-progress span { display: block; width: 0; height: 100%; background: #e5e7e2; transition: width .15s ease-out; }
      .knowledge-toc-backdrop { display: none; }
      .knowledge-layout { position: absolute; z-index: 0; inset: 0; min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 760px) 230px; justify-content: center; gap: 38px; padding: 100px 30px 70px; overflow: auto; scrollbar-color: rgba(255,255,255,.25) transparent; }
      .knowledge-toc { position: sticky; top: 0; align-self: start; max-height: calc(100vh - 130px); overflow: auto; padding: 4px 0; }
      .knowledge-toc-title { margin-bottom: 12px; color: rgba(236,238,234,.45); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
      .knowledge-toc a { display: block; padding: 6px 9px; border-left: 1px solid rgba(255,255,255,.12); color: rgba(236,238,234,.56); font-size: 12px; line-height: 1.35; text-decoration: none; }
      .knowledge-toc a:hover, .knowledge-toc a.active { border-left-color: #eceeea; color: #f4f5f1; background: rgba(255,255,255,.05); }
      .knowledge-toc a.depth-3 { padding-left: 20px; font-size: 11px; }
      .knowledge-article { min-width: 0; }
      .knowledge-hero { padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,.12); }
      .knowledge-eyebrow { color: rgba(236,238,234,.46); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
      .knowledge-hero h1 { max-width: 700px; margin: 12px 0 10px; color: #f4f5f1; font-size: clamp(30px, 4vw, 52px); font-weight: 500; line-height: 1.08; letter-spacing: 0; }
      .knowledge-meta { display: flex; flex-wrap: wrap; gap: 7px 16px; color: rgba(236,238,234,.58); font-size: 12px; }
      .knowledge-summary { margin: 24px 0 0; color: rgba(236,238,234,.82); font-size: 16px; line-height: 1.8; }
      .knowledge-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
      .knowledge-tag { padding: 5px 9px; border: 1px solid rgba(255,255,255,.17); border-radius: 999px; color: rgba(236,238,234,.7); font-size: 11px; }
      .knowledge-section { padding: 34px 0 0; scroll-margin-top: 24px; }
      .knowledge-section h2 { margin: 0 0 17px; color: #f2f3ef; font-size: 24px; font-weight: 500; line-height: 1.25; }
      .knowledge-section h3 { margin: 26px 0 10px; color: rgba(242,243,239,.9); font-size: 16px; font-weight: 500; }
      .knowledge-paragraph { margin: 0 0 14px; color: rgba(236,238,234,.78); font-size: 15px; line-height: 1.85; }
      .knowledge-markdown-list { margin: 0 0 16px; padding-left: 22px; color: rgba(236,238,234,.78); font-size: 15px; line-height: 1.8; }
      .knowledge-markdown-list li { padding-left: 4px; margin: 4px 0; }
      .knowledge-markdown-quote { margin: 16px 0; padding: 12px 14px; border-left: 2px solid rgba(245,245,245,.45); background: rgba(255,255,255,.045); color: rgba(236,238,234,.72); }
      .knowledge-markdown-quote p { margin: 0 0 8px; }
      .knowledge-markdown-quote p:last-child { margin-bottom: 0; }
      .knowledge-code { margin: 16px 0; padding: 12px 14px; overflow-x: auto; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: rgba(0,0,0,.28); color: rgba(236,238,234,.78); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
      .knowledge-divider { margin: 22px 0; border: 0; border-top: 1px solid rgba(255,255,255,.1); }
      .knowledge-image { margin: 20px 0; overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: #1a1d20; }
      .knowledge-image img { display: block; width: 100%; max-height: 340px; object-fit: cover; opacity: .92; }
      .knowledge-image.image-unavailable { min-height: 78px; display: grid; align-content: center; background: #1b1e21; }
      .knowledge-image.image-unavailable::before { content: "资料图片暂不可用"; display: block; padding: 14px 12px 0; color: rgba(236,238,234,.38); font-size: 12px; }
      .knowledge-image figcaption { padding: 9px 12px; color: rgba(236,238,234,.48); font-size: 11px; }
      .knowledge-fact-table, .knowledge-comparison { width: 100%; border-collapse: collapse; margin: 15px 0 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); font-size: 13px; }
      .knowledge-fact-table th, .knowledge-fact-table td, .knowledge-comparison th, .knowledge-comparison td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: left; vertical-align: top; }
      .knowledge-fact-table tr:last-child td, .knowledge-comparison tr:last-child td { border-bottom: 0; }
      .knowledge-fact-table th, .knowledge-comparison th { width: 34%; color: rgba(236,238,234,.5); background: rgba(255,255,255,.04); font-weight: 400; }
      .knowledge-fact-table td, .knowledge-comparison td { color: rgba(236,238,234,.82); line-height: 1.55; }
      .knowledge-insight, .knowledge-risk { margin: 19px 0; padding: 15px 17px; border-left: 2px solid rgba(236,238,234,.72); background: rgba(255,255,255,.055); }
      .knowledge-risk { border-left-color: rgba(210,170,130,.9); background: rgba(130,93,62,.13); }
      .knowledge-callout-label { margin-bottom: 6px; color: rgba(236,238,234,.52); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .knowledge-insight p, .knowledge-risk p { margin: 0; color: rgba(236,238,234,.82); font-size: 14px; line-height: 1.7; }
      .knowledge-timeline { position: relative; margin: 18px 0 4px 7px; padding-left: 22px; border-left: 1px solid rgba(255,255,255,.22); }
      .knowledge-timeline-item { position: relative; padding: 0 0 20px; }
      .knowledge-timeline-item::before { content: ""; position: absolute; top: 5px; left: -27px; width: 8px; height: 8px; border: 2px solid #e8eae6; border-radius: 50%; background: #111315; }
      .knowledge-timeline-item strong { display: block; margin-bottom: 4px; color: rgba(244,245,241,.9); font-size: 13px; font-weight: 500; }
      .knowledge-timeline-item span { color: rgba(236,238,234,.68); font-size: 13px; line-height: 1.6; }

        "多哈": "doha", "阿姆斯特丹": "amsterdam", "法兰克福": "frankfurt", "米兰": "milan",
        "罗马": "rome", "马德里": "madrid", "卢森堡": "luxembourg", "美国": "united states",
        "英国": "united kingdom", "中国": "china", "加拿大": "canada", "澳大利亚": "australia",
        "瑞士": "switzerland", "法国": "france", "德国": "germany", "阿联酋": "united arab emirates",
        "日本": "japan", "韩国": "south korea", "印度": "india", "俄罗斯": "russia",
        "意大利": "italy", "西班牙": "spain", "荷兰": "netherlands", "南非": "south africa"
      };

      function normalizeSearchText(value) {
        return String(value || "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu, "");
      }

      function getSearchTerms(query) {
        const raw = String(query || "").trim().toLowerCase();
        const alias = searchAliases[raw];
        return [...new Set([normalizeSearchText(query), normalizeSearchText(alias)].filter(Boolean))];
      }

      function getPolygonStrokeColor(polygon) {
        const properties = polygon.properties || {};
        const palette = getMapPalette();
        if (properties.kind === "province") return palette.provinceStroke;
        return polygon === selectedCountry
          ? palette.selectedStroke
          : palette.countryStroke;
      }

      function getMapPalette() {
        return document.body.dataset.theme === "light"
          ? {
              background: "#c9d5dd",
              globe: "#b9cad5",
              atmosphere: "#7f9db3",
              point: "#173f5f",
              path: "rgba(23, 63, 95, .9)",
              provinceStroke: "rgba(23, 63, 95, .7)",
              selectedStroke: "rgba(23, 63, 95, .96)",
              countryStroke: "rgba(64, 88, 108, .48)",
              countryCap: "rgba(255, 255, 255, .68)",
              countrySide: "rgba(64, 88, 108, .16)",
              ring: ["rgba(23, 63, 95, .9)", "rgba(23, 63, 95, 0)"]
            }
          : {
              background: "#0b0c0e",
              globe: "#111315",
              atmosphere: "#9da2a8",
              point: "#f5f5f5",
              path: "rgba(255, 255, 255, .96)",
              provinceStroke: "rgba(245, 245, 245, .9)",
              selectedStroke: "rgba(255, 255, 255, .96)",
              countryStroke: "rgba(190, 195, 200, .5)",
              countryCap: "rgba(45, 48, 52, .76)",
              countrySide: "rgba(180, 185, 190, .14)",
              ring: ["rgba(255, 255, 255, .95)", "rgba(255, 255, 255, 0)"]
            };
      }

      function getPointRadius(point) {
        const baseRadius = Math.min(0.62, 0.28 + Math.sqrt(point.count || 1) * 0.035);
        return point === selectedOfficePoint ? baseRadius * 1.22 : baseRadius;
      }

      function getBoundaryPaths(geometry) {
        const paths = [];

        function visit(value) {
          if (!Array.isArray(value) || !value.length) return;
          if (Array.isArray(value[0]) && typeof value[0][0] === "number" && typeof value[0][1] === "number") {
            paths.push({
              points: value.map(([lng, lat]) => ({ lat, lng: normalizeLongitude(lng) }))
            });
            return;
          }
          value.forEach(visit);
        }

        visit(geometry?.coordinates);
        return paths;
      }

      function updateMapHighlights() {
        const palette = getMapPalette();
        globe
          .pathsData(selectedCountry ? getBoundaryPaths(selectedCountry.geometry) : [])
          .ringsData(selectedOfficePoint ? [selectedOfficePoint] : [])
          .polygonStrokeColor(getPolygonStrokeColor)
          .pointAltitude((point) => point === selectedOfficePoint ? 0.065 : 0.035)
          .pointRadius(getPointRadius)
          .pointColor(() => palette.point)
          .pathColor(() => palette.path)
          .ringColor(() => palette.ring);
      }

      const globe = Globe({ animateIn: true })(globeContainer)
        .backgroundColor("#0b0c0e")
        .showAtmosphere(!isTouchDevice)
        .atmosphereColor(getMapPalette().atmosphere)
        .atmosphereAltitude(isTouchDevice ? 0.1 : 0.16)
        .polygonAltitude(({ properties }) => properties.kind === "province" ? 0.032 : 0.012)
        .polygonCapColor(({ properties }) => properties.kind === "province" ? "transparent" : getMapPalette().countryCap)
        .polygonSideColor(({ properties }) => properties.kind === "province" ? "transparent" : getMapPalette().countrySide)
        .polygonStrokeColor(getPolygonStrokeColor)
        .polygonLabel(({ properties }) => properties.name || properties.NAME)
        .onPolygonClick(handleCountryClick)
        .pointsData(offices)
        .pointLat("lat")
        .pointLng("lng")
        .pointAltitude((point) => point === selectedOfficePoint ? 0.065 : 0.035)
        .pointRadius(getPointRadius)
        .pointsTransitionDuration(650)
        .pointColor(() => getMapPalette().point)
        .pointLabel(({ city, country, count }) => `${city}${country ? ` · ${country}` : ""} · ${count} 家`)
        .onPointClick(handleOfficeClick)
        .pathsData([])
        .pathPoints("points")
        .pathPointLat("lat")
        .pathPointLng("lng")
        .pathColor(() => getMapPalette().path)
        .pathStroke(2.8)
        .pathDashLength(0.72)
        .pathDashGap(0.28)
        .pathDashAnimateTime(1500)
        .pathTransitionDuration(500)
        .ringsData([])
        .ringLat("lat")
        .ringLng("lng")
        .ringColor(() => getMapPalette().ring)
        .ringMaxRadius(1.45)
        .ringPropagationSpeed(1.15)
        .ringRepeatPeriod(1250);
      globe.polygonsTransitionDuration(600);

      const globeControls = globe.controls();
      globeControls.autoRotate = !isTouchDevice;
      globeControls.autoRotateSpeed = 0.18;
      globeControls.enableDamping = !isTouchDevice;
      globeControls.rotateSpeed = isTouchDevice ? 0.55 : 0.8;
      globeControls.zoomSpeed = isTouchDevice ? 0.65 : 1;
      const renderer = typeof globe.renderer === "function" ? globe.renderer() : null;
      renderer?.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouchDevice ? 1.25 : 1.75));

      globe.pointOfView(defaultView, 0);

      function applyTheme(theme, persist = true) {
        const nextTheme = theme === "light" ? "light" : "dark";
        document.body.dataset.theme = nextTheme;
        document.documentElement.style.colorScheme = nextTheme;
        themeToggle.setAttribute("aria-pressed", String(nextTheme === "light"));
        themeToggle.setAttribute("aria-label", nextTheme === "light" ? "切换到深色模式" : "切换到浅色模式");
        themeToggle.title = nextTheme === "light" ? "深色模式" : "浅色模式";
        themeToggleLabel.textContent = nextTheme === "light" ? "深色模式" : "浅色模式";
        themeColorMeta?.setAttribute("content", nextTheme === "light" ? "#e6edf2" : "#0d0e10");
        if (persist) {
          try { window.localStorage.setItem("foc-map-theme", nextTheme); } catch { /* storage may be unavailable in an embedded webview */ }
        }
        const palette = getMapPalette();
        globe.backgroundColor(palette.background).atmosphereColor(palette.atmosphere);
        const globeMaterial = globe.globeMaterial();
        if (globeMaterial?.color?.set) {
          globeMaterial.color.set(palette.globe);
          globeMaterial.roughness = 0.88;
          globeMaterial.metalness = 0.04;
        }
        globe.polygonCapColor(({ properties }) => properties.kind === "province" ? "transparent" : palette.countryCap);
        globe.polygonSideColor(({ properties }) => properties.kind === "province" ? "transparent" : palette.countrySide);
        globe.pointColor(() => palette.point).pathColor(() => palette.path).ringColor(() => palette.ring);
        updateMapHighlights();
      }

      applyTheme(initialTheme, false);
      themeToggle.addEventListener("click", () => applyTheme(document.body.dataset.theme === "light" ? "dark" : "light"));

      function handleCountryClick(polygon) {
        clearOfficeSelection();
        selectedCountry = polygon.properties?.kind === "province" ? null : polygon;
        selectedOfficePoint = null;
        updateMapHighlights();
        const properties = polygon.properties || {};
        if (properties.kind === "province") {
          const name = properties.name || "行政区";
          const description = `行政区：${name}`;
          showSelection(name, description);
          return;
        }

        const name = properties.NAME || "Unknown";
        globeControls.autoRotate = false;
        const view = getCountryView(polygon);
        globe.pointOfView(view, 900);
        showSelection(name, "国家已选中");
      }

      function handleOfficeClick(point) {
        selectedPoint = point;
        selectedCountry = null;
        selectedOfficePoint = point;
        updateMapHighlights();
        globeControls.autoRotate = false;
        globe.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.28 }, 900);
        const officeNames = getOfficeNames(point);

        if (officeNames.length > 1) {
          showCityOfficeList(point);
          return;
        }

        selectOffice(point, officeNames[0] || point.city);
      }

      function getOfficeNames(point) {
        return [...new Set((point?.institutionNames || []).filter(Boolean).map((name) => String(name).trim()).filter(Boolean))];
      }

      function findKnowledgeSlugByOfficeName(officeName) {
        const normalizedName = String(officeName || "").trim().toLowerCase();
        return Object.entries(knowledgeCatalog).find(([, article]) =>
          (article.officeNames || []).some((name) => String(name).trim().toLowerCase() === normalizedName)
        )?.[0] || null;
      }

      function getKnowledgeBadge(knowledgeSlug) {
        if (!knowledgeSlug) return "待补充";
        return knowledgeCatalog[knowledgeSlug]?.sourceUrl ? "有研究" : "资料卡";
      }

      function showSelection(name, description, knowledgeSlug = null, kicker = "Selected region") {
        selectedName.textContent = name;
        selectedDescription.textContent = description;
        selectedKnowledgeSlug = knowledgeSlug;
        readKnowledge.hidden = !knowledgeSlug;
        selectionKicker.textContent = kicker;
        selection.classList.add("visible");
        searchPanel.hidden = true;
        filterPanel.hidden = true;
        statsPanel.hidden = true;
        mapStatus.textContent = "已定位 · 点击返回按钮回到全球视角";
        selection.classList.remove("is-updating");
        if (selectionMotionFrame !== null) {
          window.cancelAnimationFrame(selectionMotionFrame);
        }
        selectionMotionFrame = window.requestAnimationFrame(() => {
          selection.classList.add("is-updating");
          selectionMotionFrame = null;
        });
      }

      function showCityOfficeList(point) {
        const officeNames = getOfficeNames(point);
        selectedOfficeName = null;
        showSelection(
          point.city,
          `${point.country ? `${point.country} · ` : ""}${officeNames.length} 家家族办公室，请选择一家查看详情`,
          null,
          "City offices"
        );
        officeListPanel.hidden = false;
        officeListCount.textContent = `${officeNames.length} 家`;
        officeListSearch.value = "";
        renderOfficeList("");
        mapStatus.textContent = "已定位 · 请选择具体家族办公室";
      }

      function selectOffice(point, officeName) {
        selectedPoint = point;
        selectedOfficeName = officeName;
        const knowledgeSlug = findKnowledgeSlugByOfficeName(officeName);
        const location = [point.city, point.country].filter(Boolean).join(" · ");
        const researchStatus = knowledgeSlug
          ? (getKnowledgeBadge(knowledgeSlug) === "有研究" ? "已有深度研究" : "已有资料卡")
          : "深度研究待补充";
        showSelection(officeName, `${location} · ${researchStatus}`, knowledgeSlug, "Selected office");
        officeListPanel.hidden = getOfficeNames(point).length <= 1;
        if (!officeListPanel.hidden) {
          renderOfficeList(officeListSearch.value);
        }
        mapStatus.textContent = knowledgeSlug
          ? `已选择家族办公室 · ${getKnowledgeBadge(knowledgeSlug) === "有研究" ? "可打开深度研究" : "可查看资料卡"}`
          : "已选择家族办公室 · 该家办暂无深度研究";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderOfficeList(query = "") {
        if (!selectedPoint) return;
        const officeNames = getOfficeNames(selectedPoint);
        const normalizedQuery = String(query).trim().toLowerCase();
        const matches = officeNames.filter((officeName) => !normalizedQuery || officeName.toLowerCase().includes(normalizedQuery));
        officeListCount.textContent = normalizedQuery ? `${matches.length}/${officeNames.length} 家` : `${officeNames.length} 家`;

        if (!matches.length) {
          officeList.innerHTML = '<div class="office-list-empty">没有找到匹配的家办</div>';
          return;
        }

        officeList.innerHTML = matches.map((officeName, index) => {
          const knowledgeSlug = findKnowledgeSlugByOfficeName(officeName);
          const activeClass = selectedOfficeName === officeName ? " active" : "";
          return `<button class="office-list-item${activeClass}" type="button" data-office-index="${index}"><span>${escapeHtml(officeName)}</span><span class="office-list-badge">${getKnowledgeBadge(knowledgeSlug)}</span></button>`;
        }).join("");

        officeList.querySelectorAll(".office-list-item").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            selectOffice(selectedPoint, matches[Number(button.dataset.officeIndex)]);
          });
        });
      }

      function clearOfficeSelection() {
        selectedPoint = null;
        selectedOfficeName = null;
        officeListPanel.hidden = true;
        officeListSearch.value = "";
        officeList.innerHTML = "";
        officeListCount.textContent = "";
      }

      function closeFloatingPanels() {
        searchPanel.hidden = true;
        filterPanel.hidden = true;
        statsPanel.hidden = true;
        closeCountryPicker();
        selection.classList.remove("visible");
        selection.classList.remove("is-updating");
        readKnowledge.hidden = true;
        selectedKnowledgeSlug = null;
        selectionKicker.textContent = "Selected region";
        clearOfficeSelection();
      }

      function resetView() {
        if (countries) globe.polygonsData(countries.features);
        globe.pointsData(offices);
        selectedCountry = null;
        selectedOfficePoint = null;
        updateMapHighlights();
        countryFilter.value = "all";
        syncCountryPicker();
        majorCitiesFilter.checked = false;
        filterCount.textContent = "显示全部城市";
        renderStats(offices);
        closeFloatingPanels();
        globeControls.autoRotate = !isTouchDevice;
        globe.pointOfView(defaultView, 900);
        mapStatus.textContent = "拖动旋转 · 滚轮缩放 · 点击国家查看";
      }

      document.getElementById("back").addEventListener("click", resetView);
      document.getElementById("reset-view").addEventListener("click", resetView);
      document.getElementById("overview").addEventListener("click", resetView);

      document.getElementById("zoom-in").addEventListener("click", () => {
        const view = globe.pointOfView();
        globe.pointOfView({ ...view, altitude: Math.max(0.1, view.altitude * 0.78) }, 320);
      });

      document.getElementById("zoom-out").addEventListener("click", () => {
        const view = globe.pointOfView();
        globe.pointOfView({ ...view, altitude: Math.min(3.6, view.altitude * 1.28) }, 320);
      });

      document.getElementById("search-toggle").addEventListener("click", () => {
        searchPanel.hidden = !searchPanel.hidden;
        filterPanel.hidden = true;
        statsPanel.hidden = true;
        selection.classList.remove("visible");
        if (!searchPanel.hidden) {
          searchInput.focus();
          renderSearchResults("");
        }
      });

      document.getElementById("filter-toggle").addEventListener("click", () => {
        filterPanel.hidden = !filterPanel.hidden;
        searchPanel.hidden = true;
        statsPanel.hidden = true;
        selection.classList.remove("visible");
      });

      document.getElementById("stats-toggle").addEventListener("click", () => {
        statsPanel.hidden = !statsPanel.hidden;
        searchPanel.hidden = true;
        filterPanel.hidden = true;
        selection.classList.remove("visible");
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest(".side-rail, .search-panel, .filter-panel, .stats-panel, .selection, .map-tools")) return;
        closeFloatingPanels();
      });

      function closeCountryPicker() {
        countryPickerMenu.hidden = true;
        countryPickerTrigger.setAttribute("aria-expanded", "false");
      }

      function syncCountryPicker() {
        const selectedOption = countryFilter.options[countryFilter.selectedIndex];
        countryPickerLabel.textContent = selectedOption?.textContent || "全部国家 / 地区";
        countryPickerTrigger.setAttribute("aria-expanded", String(!countryPickerMenu.hidden));
        countryPickerMenu.querySelectorAll(".country-picker-option").forEach((optionButton) => {
          const isSelected = optionButton.dataset.value === countryFilter.value;
          optionButton.setAttribute("aria-selected", String(isSelected));
        });
      }

      function renderCountryPicker() {
        countryPickerMenu.innerHTML = "";
        [...countryFilter.options].forEach((option) => {
          const optionButton = document.createElement("button");
          optionButton.className = "country-picker-option";
          optionButton.type = "button";
          optionButton.setAttribute("role", "option");
          optionButton.dataset.value = option.value;
          optionButton.textContent = option.textContent;
          optionButton.addEventListener("click", (event) => {
            event.stopPropagation();
            countryFilter.value = option.value;
            countryFilter.dispatchEvent(new Event("change", { bubbles: true }));
            closeCountryPicker();
          });
          countryPickerMenu.appendChild(optionButton);
        });
        syncCountryPicker();
      }

      countryPickerTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        const willOpen = countryPickerMenu.hidden;
        countryPickerMenu.hidden = !willOpen;
        countryPickerTrigger.setAttribute("aria-expanded", String(willOpen));
        if (willOpen) {
          countryPickerMenu.querySelector(`[data-value="${CSS.escape(countryFilter.value)}"]`)?.scrollIntoView({ block: "nearest" });
        }
      });

      async function openKnowledgeArticle(slug) {
        if (!slug) return;
        readKnowledge.disabled = true;
        mapStatus.textContent = "正在加载家办文章";
        const opened = await window.KnowledgeReader.open(slug);
        readKnowledge.disabled = false;
        if (!opened) {
          mapStatus.textContent = "文章暂时无法加载";
          return;
        }
        closeFloatingPanels();
        mapStatus.textContent = "正在阅读家办研究";
      }

      function closeKnowledgeArticle() {
        window.KnowledgeReader.close();
        mapStatus.textContent = "拖动旋转 · 滚轮缩放 · 点击国家查看";
      }

      readKnowledge.addEventListener("click", () => openKnowledgeArticle(selectedKnowledgeSlug));
      document.addEventListener("knowledge:closed", () => {
        mapStatus.textContent = "拖动旋转 · 滚轮缩放 · 点击国家查看";
      });

      function getFilteredOffices() {
        const country = countryFilter.value;
        const majorOnly = majorCitiesFilter.checked;
        return offices.filter((point) => {
          const countryMatch = country === "all" || (point.country || "全球") === country;
          const sizeMatch = !majorOnly || Number(point.count || 0) >= 5;
          return countryMatch && sizeMatch;
        });
      }

      function applyFilters() {
        const filtered = getFilteredOffices();
        globe.pointsData(filtered);
        filterCount.textContent = `显示 ${filtered.length} 个城市`;
        renderStats(filtered);
      }

      function renderStats(filtered = getFilteredOffices()) {
        const total = filtered.reduce((sum, point) => sum + Number(point.count || 0), 0);
        const countriesList = [...new Set(filtered.map((point) => point.country || "全球"))].sort((a, b) => a.localeCompare(b));
        const countryLabel = countryFilter.value === "all"
          ? "全部国家 / 地区"
          : countryFilter.options[countryFilter.selectedIndex]?.textContent || countryFilter.value;
        const filterSummary = countryFilter.value === "all"
          ? (majorCitiesFilter.checked ? "重点城市" : "全部城市")
          : (majorCitiesFilter.checked ? `${countryLabel} · 重点城市` : countryLabel);
        const topCities = [...filtered]
          .sort((a, b) => Number(b.count || 0) - Number(a.count || 0))
          .slice(0, 5);
        const maxCount = Number(topCities[0]?.count || 0);

        const hasActiveFilter = countryFilter.value !== "all" || majorCitiesFilter.checked;
        statsScope.textContent = hasActiveFilter ? "筛选结果" : "全部数据";
        statsFilterSummary.textContent = filterSummary;
        document.getElementById("total-offices").textContent = total.toLocaleString("zh-CN");
        document.getElementById("total-cities").textContent = filtered.length.toLocaleString("zh-CN");
        document.getElementById("total-countries").textContent = countriesList.length.toLocaleString("zh-CN");

        if (!topCities.length) {
          topCitiesRoot.innerHTML = '<div class="stats-empty">当前筛选没有匹配城市</div>';
          return;
        }

        topCitiesRoot.innerHTML = topCities.map((point, index) => {
          const count = Number(point.count || 0);
          const share = total > 0 ? `${Math.round((count / total) * 100)}%` : "0%";
          const barWidth = maxCount > 0 ? `${Math.max(8, Math.round((count / maxCount) * 100))}%` : "0%";
          return `<button class="top-city" type="button" data-city-index="${index}" aria-label="定位 ${escapeHtml(point.city)}，${count} 家家族办公室"><span class="top-city-heading"><span>${escapeHtml(point.city)}</span><small>${count.toLocaleString("zh-CN")} 家 · ${share}</small></span><span class="top-city-bar" aria-hidden="true"><span style="width:${barWidth}"></span></span></button>`;
        }).join("");

        topCitiesRoot.querySelectorAll(".top-city").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            handleOfficeClick(topCities[Number(button.dataset.cityIndex)]);
          });
        });
      }

      function populatePanels() {
        const countriesList = [...new Set(offices.map((point) => point.country || "全球"))].sort((a, b) => a.localeCompare(b));
        countryFilter.insertAdjacentHTML("beforeend", countriesList.map((country) => `<option value="${country}">${country}</option>`).join(""));
        renderCountryPicker();
        renderStats(offices);
      }

      countryFilter.addEventListener("change", () => {
        syncCountryPicker();
        applyFilters();
      });
      majorCitiesFilter.addEventListener("change", applyFilters);
      document.getElementById("clear-filter").addEventListener("click", () => {
        countryFilter.value = "all";
        syncCountryPicker();
        majorCitiesFilter.checked = false;
        applyFilters();
      });

      searchInput.addEventListener("input", (event) => renderSearchResults(event.target.value));
      officeListSearch.addEventListener("input", (event) => renderOfficeList(event.target.value));

      function renderSearchResults(query) {
        const terms = getSearchTerms(query);
        const normalizedQuery = normalizeSearchText(query);
        const matches = offices
          .map((point) => {
            const city = normalizeSearchText(point.city);
            const country = normalizeSearchText(point.country || "全球");
            const countryCode = normalizeSearchText(point.countryCode);
            const institutions = (point.institutionNames || []).map(normalizeSearchText);
            let score = normalizedQuery ? 0 : 1;

            terms.forEach((term) => {
              if (!term) return;
              if (city === term) score = Math.max(score, 100);
              else if (city.startsWith(term)) score = Math.max(score, 85);
              else if (city.includes(term)) score = Math.max(score, 75);
              if (country === term || countryCode === term) score = Math.max(score, 90);
              else if (country.startsWith(term)) score = Math.max(score, 78);
              else if (country.includes(term)) score = Math.max(score, 68);
              if (institutions.some((name) => name === term)) score = Math.max(score, 95);
              else if (institutions.some((name) => name.includes(term))) score = Math.max(score, 65);
            });

            return { point, score };
          })
          .filter(({ score }) => score > 0)
          .sort((a, b) => b.score - a.score || Number(b.point.count || 0) - Number(a.point.count || 0))
          .map(({ point }) => point);

        if (!matches.length) {
          searchResults.innerHTML = '<div class="search-empty">没有找到匹配的城市、国家或家办</div>';
          return;
        }

        searchResults.innerHTML = matches.map((point, index) => `
          <button class="search-result" data-result-index="${index}">
            <span>${point.city}</span>
            <small>${point.country || "全球"} · ${point.count} 家</small>
          </button>
        `).join("");

        searchResults.querySelectorAll(".search-result").forEach((button) => {
          button.addEventListener("click", () => {
            const point = matches[Number(button.dataset.resultIndex)];
            searchPanel.hidden = true;
            handleOfficeClick(point);
          });
        });
      }

      function getGeometryCoordinates(geometry) {
        const coordinates = [];

        function visit(value) {
          if (!Array.isArray(value)) return;
          if (typeof value[0] === "number" && typeof value[1] === "number") {
            coordinates.push([value[0], value[1]]);
            return;
          }
          value.forEach(visit);
        }

        visit(geometry?.coordinates);
        return coordinates;
      }

      function normalizeLongitude(lng) {
        return ((lng + 540) % 360) - 180;
      }

      function getCircularLongitudeRange(coordinates) {
        if (!coordinates.length) return { span: 0, center: 0 };

        const longitudes = coordinates
          .map(([lng]) => (lng + 360) % 360)
          .sort((a, b) => a - b);
        let largestGap = -1;
        let largestGapIndex = 0;

        for (let index = 0; index < longitudes.length; index += 1) {
          const next = index === longitudes.length - 1
            ? longitudes[0] + 360
            : longitudes[index + 1];
          const gap = next - longitudes[index];
          if (gap > largestGap) {
            largestGap = gap;
            largestGapIndex = index;
          }
        }

        const start = longitudes[(largestGapIndex + 1) % longitudes.length];
        const span = Math.min(360, 360 - largestGap);
        return {
          span,
          center: normalizeLongitude(start + span / 2)
        };
      }

      function getCountryView(polygon) {
        const properties = polygon.properties || {};
        const coordinates = getGeometryCoordinates(polygon.geometry);
        const bounds = getGeometryBounds(polygon.geometry);

        if (!bounds || !coordinates.length) {
          return { lat: 0, lng: 0, altitude: 0.65 };
        }

        const longitudeRange = getCircularLongitudeRange(coordinates);
        const latitudeSpan = bounds.maxLat - bounds.minLat;
        const longitudeSpan = longitudeRange.span;
        const geometryLat = (bounds.minLat + bounds.maxLat) / 2;
        const geometryLng = longitudeRange.center;
        const labelLat = Number(properties.LABEL_Y);
        const labelLng = Number(properties.LABEL_X);
        const hasLabelPoint = properties.LABEL_Y != null && properties.LABEL_X != null &&
          Number.isFinite(labelLat) && Number.isFinite(labelLng);
        const labelLngOffset = hasLabelPoint
          ? Math.abs(((normalizeLongitude(labelLng) - geometryLng + 540) % 360) - 180)
          : Infinity;
        const useLabelPoint = hasLabelPoint &&
          labelLngOffset <= Math.max(12, longitudeSpan * 0.25) &&
          Math.abs(labelLat - geometryLat) <= Math.max(8, latitudeSpan * 0.25);
        const lat = useLabelPoint ? labelLat : geometryLat;
        const lng = useLabelPoint ? normalizeLongitude(labelLng) : geometryLng;
        const longitudeAtLatitude = longitudeSpan * Math.max(0.25, Math.cos(lat * Math.PI / 180));
        const countrySpan = Math.max(latitudeSpan, longitudeAtLatitude);
        const narrowViewportFactor = Math.max(1, (globeContainer.clientHeight || 1) / (globeContainer.clientWidth || 1));
        // Reserve room around the full country bounds so the globe does not crop them.
        const fitRatio = countrySpan / 32;
        const altitude = Math.min(
          1.25,
          Math.max(0.12, 0.12 + 0.58 * Math.pow(fitRatio, 1.15) * narrowViewportFactor)
        );

        return { lat, lng, altitude };
      }

      function getGeometryBounds(geometry) {
        const coordinates = getGeometryCoordinates(geometry);

        if (!coordinates?.length) return null;

        return coordinates.reduce(
          (bounds, [lng, lat]) => ({
            minLng: Math.min(bounds.minLng, lng),
            maxLng: Math.max(bounds.maxLng, lng),
            minLat: Math.min(bounds.minLat, lat),
            maxLat: Math.max(bounds.maxLat, lat)
          }),
          { minLng: Infinity, maxLng: -Infinity, minLat: Infinity, maxLat: -Infinity }
        );
      }

      countries = window.COUNTRIES_GEOJSON;
      globe.polygonsData(countries.features);
      populatePanels();
    </script>
  </body>
</html>
