<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      :root {
        --ink: #0d0e10;
        --rail: rgba(29, 30, 32, .7);
        --panel: rgba(29, 30, 32, .68);
        --line: rgba(255, 255, 255, .16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, .58);
        --soft: rgba(245, 245, 245, .1);
        --accent: #f5f5f5;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: -apple-system, "SF UI Text", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      button, input { font: inherit; }
      button { color: inherit; }
      #globe { width: 100%; height: 100%; touch-action: none; }

      .side-rail { position: fixed; z-index: 5; left: 50%; bottom: 18px; width: auto; height: 54px; display: flex; align-items: center; transform: translateX(-50%); background: var(--rail); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.28); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .rail-brand { display: none; }
      .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.72); color: var(--accent); border-radius: 8px; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .rail-group { display: flex; align-items: center; padding: 4px; }
      .tool-button { position: relative; width: 44px; height: 44px; margin: 0 2px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; opacity: .68; transition: opacity .2s, background .2s, color .2s; }
      .tool-button:hover, .tool-button.active { color: var(--accent); opacity: 1; background: rgba(255,255,255,.12); border-radius: 9px; }
      .tool-button.active::before { content: ""; position: absolute; bottom: -5px; width: 18px; height: 2px; border-radius: 2px; background: var(--accent); }
      .tool-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .tool-button .tool-label { position: absolute; left: 50%; bottom: 52px; display: none; transform: translateX(-50%); white-space: nowrap; padding: 7px 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .tool-button:hover .tool-label { display: block; }

      .live-status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .live-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.15); }

      .map-tools { position: fixed; z-index: 4; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
      .map-tool { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: rgba(17,18,20,.66); color: rgba(255,255,255,.82); cursor: pointer; font-size: 18px; line-height: 1; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .map-tool:hover { color: var(--accent); border-color: rgba(255,255,255,.7); }
      .map-tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      .search-panel { position: fixed; z-index: 6; left: 50%; bottom: 88px; top: auto; width: min(360px, calc(100vw - 40px)); transform: translateX(-50%); padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .search-panel[hidden], .legend-panel[hidden] { display: none; }
      .search-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .search-input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: 0; background: rgba(0,0,0,.2); color: var(--text); font-size: 13px; }
      .search-input:focus { border-color: rgba(255,255,255,.72); }
      .search-results { margin-top: 8px; max-height: 220px; overflow: auto; }
      .search-result { width: 100%; padding: 9px 8px; display: flex; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid rgba(255,255,255,.08); border-radius: 7px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
      .search-result:hover { background: rgba(255,255,255,.1); }
      .search-result small { color: var(--muted); font-size: 11px; }
      .search-empty { padding: 12px 8px; color: var(--muted); font-size: 12px; }

      .legend-panel { position: fixed; z-index: 4; left: 50%; right: auto; bottom: 88px; transform: translateX(-50%); width: 190px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .legend-title { margin-bottom: 12px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .legend-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; color: rgba(244,244,241,.78); font-size: 12px; }
      .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.16); }
      .legend-dot.teal { background: #a6a9ad; box-shadow: 0 0 0 3px rgba(166,169,173,.18); }

      .selection { position: fixed; z-index: 4; left: 50%; bottom: 88px; width: min(350px, calc(100vw - 40px)); transform: translateX(-50%); display: none; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .selection.visible { display: block; }
      .selection-kicker { color: var(--accent); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .selection strong { display: block; margin: 7px 0 4px; color: var(--text); font-size: 21px; font-weight: 500; }
      .selection p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .selection-meta { display: flex; gap: 16px; margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.1); color: var(--muted); font-size: 11px; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      .action-button { height: 30px; padding: 0 11px; border: 1px solid rgba(255,255,255,.56); border-radius: 8px; background: rgba(255,255,255,.06); color: var(--accent); cursor: pointer; font-size: 12px; }
      .action-button:hover { background: rgba(255,255,255,.14); }
      .map-status { position: fixed; z-index: 3; left: 50%; bottom: 78px; transform: translateX(-50%); color: rgba(255,255,255,.45); font-size: 11px; pointer-events: none; }

      @media (max-width: 600px) {
        .side-rail { bottom: 12px; }
        .search-panel, .selection { bottom: 80px; width: calc(100vw - 24px); }
        .map-tools { right: 12px; bottom: 88px; }
        .legend-panel { bottom: 80px; }
        .map-status { display: none; }
      }

    </style>
  </head>
  <body>
    <div id="globe"></div>
    <aside class="side-rail" aria-label="地图工具">
      <div class="rail-brand"><span class="brand-mark">FO</span></div>
      <div class="rail-group">
        <button class="tool-button active" id="overview" title="全球视角" aria-label="全球视角">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.1 2.3 3.2 5.1 3.2 8.5s-1.1 6.2-3.2 8.5c-2.1-2.3-3.2-5.1-3.2-8.5S9.9 5.8 12 3.5Z"/></svg>
          <span class="tool-label">全球视角</span>
        </button>
        <button class="tool-button" id="search-toggle" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.4 15.4 5 5"/></svg>
          <span class="tool-label">搜索</span>
        </button>
        <button class="tool-button" id="legend-toggle" title="图例" aria-label="图例">
          <svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4z"/><path d="M8 9h8M8 12h5M8 15h8"/></svg>
          <span class="tool-label">图例</span>
        </button>
      </div>
      <div class="rail-group">
        <button class="tool-button" id="info-toggle" title="说明" aria-label="说明">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 10.5v5M12 7.7h.01"/></svg>
          <span class="tool-label">说明</span>
        </button>
      </div>
    </aside>
    <div class="search-panel" id="search-panel" hidden>
      <label class="search-label" for="search-input">搜索城市或国家</label>
      <input class="search-input" id="search-input" type="search" placeholder="例如：伦敦、美国" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="legend-panel" id="legend-panel" hidden>
      <div class="legend-title">图例</div>
      <div class="legend-row"><span class="legend-dot"></span>家族办公室城市</div>
      <div class="legend-row"><span class="legend-dot teal"></span>选中位置</div>
    </div>
    <div class="map-tools" aria-label="地图控制">
      <button class="map-tool" id="zoom-in" title="放大" aria-label="放大">+</button>
      <button class="map-tool" id="zoom-out" title="缩小" aria-label="缩小">−</button>
      <button class="map-tool" id="reset-view" title="复位视角" aria-label="复位视角">
        <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 5.5v4h4"/></svg>
      </button>
    </div>
    <div id="selection" class="selection">
      <div class="selection-kicker">Selected region</div>
      <strong id="selected-name"></strong>
      <p id="selected-description"></p>
      <div class="selection-meta"><span>地图数据</span><span>知识库同步</span></div>
      <div class="actions"><button class="action-button" id="back">返回全球视角</button></div>
    </div>
    <div class="map-status" id="map-status">拖动旋转 · 滚轮缩放 · 点击国家查看</div>
    <script src="vendor/globe.gl.min.js"></script>
    <script src="data/countries.js"></script>
    <script src="data/family-office-locations.js"></script>
    <script>
      const globeContainer = document.getElementById("globe");
      const selection = document.getElementById("selection");
      const selectedName = document.getElementById("selected-name");
      const selectedDescription = document.getElementById("selected-description");
      const mapStatus = document.getElementById("map-status");
      const searchPanel = document.getElementById("search-panel");
      const searchInput = document.getElementById("search-input");
      const searchResults = document.getElementById("search-results");
      const legendPanel = document.getElementById("legend-panel");
      const defaultView = { lat: 24, lng: 40, altitude: 2.6 };
      let countries = null;
      const isTouchDevice = Boolean(window.matchMedia?.("(pointer: coarse)").matches || navigator.maxTouchPoints > 0);

      const offices = window.FAMILY_OFFICE_LOCATIONS || [];

      const globe = Globe({ animateIn: true })(globeContainer)
        .backgroundColor("#0b0c0e")
        .showAtmosphere(!isTouchDevice)
        .atmosphereColor("#9da2a8")
        .atmosphereAltitude(isTouchDevice ? 0.1 : 0.16)
        .polygonAltitude(({ properties }) => properties.kind === "province" ? 0.032 : 0.012)
        .polygonCapColor(({ properties }) => properties.kind === "province" ? "transparent" : "rgba(45, 48, 52, 0.76)")
        .polygonSideColor(({ properties }) => properties.kind === "province" ? "transparent" : "rgba(180, 185, 190, 0.14)")
        .polygonStrokeColor(({ properties }) => properties.kind === "province" ? "rgba(245, 245, 245, 0.9)" : "rgba(190, 195, 200, 0.5)")
        .polygonLabel(({ properties }) => properties.name || properties.NAME)
        .onPolygonClick(handleCountryClick)
        .pointsData(offices)
        .pointLat("lat")
        .pointLng("lng")
        .pointAltitude(0.035)
        .pointRadius(({ count }) => Math.min(0.62, 0.28 + Math.sqrt(count || 1) * 0.035))
        .pointColor(() => "#f5f5f5")
        .pointLabel(({ city, country, count }) => `${city}${country ? ` · ${country}` : ""} · ${count} 家`)
        .onPointClick(handleOfficeClick);

      const globeControls = globe.controls();
      globeControls.autoRotate = !isTouchDevice;
      globeControls.autoRotateSpeed = 0.18;
      globeControls.enableDamping = !isTouchDevice;
      globeControls.rotateSpeed = isTouchDevice ? 0.55 : 0.8;
      globeControls.zoomSpeed = isTouchDevice ? 0.65 : 1;
      const renderer = typeof globe.renderer === "function" ? globe.renderer() : null;
      renderer?.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouchDevice ? 1.25 : 1.75));

      globe.pointOfView(defaultView, 0);

      function handleCountryClick(polygon) {
        const properties = polygon.properties || {};
        if (properties.kind === "province") {
          const name = properties.name || "行政区";
          const description = `行政区：${name}`;
          showSelection(name, description);
          return;
        }

        const name = properties.NAME || "Unknown";
        globeControls.autoRotate = false;
        const view = getCountryView(polygon);
        globe.pointOfView(view, 900);
        showSelection(name, "国家已选中");
      }

      function handleOfficeClick(point) {
        globeControls.autoRotate = false;
        globe.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.28 }, 900);
        const description = `${point.country ? `${point.country} · ` : ""}${point.count} 家家族办公室`;
        showSelection(point.city, description);
      }

      function showSelection(name, description) {
        selectedName.textContent = name;
        selectedDescription.textContent = description;
        selection.classList.add("visible");
        searchPanel.hidden = true;
        legendPanel.hidden = true;
        mapStatus.textContent = "已定位 · 点击返回按钮回到全球视角";
      }

      function closeFloatingPanels() {
        searchPanel.hidden = true;
        legendPanel.hidden = true;
        selection.classList.remove("visible");
      }

      function resetView() {
        if (countries) globe.polygonsData(countries.features);
        closeFloatingPanels();
        globeControls.autoRotate = !isTouchDevice;
        globe.pointOfView(defaultView, 900);
        mapStatus.textContent = "拖动旋转 · 滚轮缩放 · 点击国家查看";
      }

      document.getElementById("back").addEventListener("click", resetView);
      document.getElementById("reset-view").addEventListener("click", resetView);
      document.getElementById("overview").addEventListener("click", resetView);

      document.getElementById("zoom-in").addEventListener("click", () => {
        const view = globe.pointOfView();
        globe.pointOfView({ ...view, altitude: Math.max(0.1, view.altitude * 0.78) }, 320);
      });

      document.getElementById("zoom-out").addEventListener("click", () => {
        const view = globe.pointOfView();
        globe.pointOfView({ ...view, altitude: Math.min(3.6, view.altitude * 1.28) }, 320);
      });

      document.getElementById("search-toggle").addEventListener("click", () => {
        searchPanel.hidden = !searchPanel.hidden;
        legendPanel.hidden = true;
        selection.classList.remove("visible");
        if (!searchPanel.hidden) {
          searchInput.focus();
          renderSearchResults("");
        }
      });

      document.getElementById("legend-toggle").addEventListener("click", () => {
        legendPanel.hidden = !legendPanel.hidden;
        searchPanel.hidden = true;
        selection.classList.remove("visible");
      });

      document.getElementById("info-toggle").addEventListener("click", () => {
        searchPanel.hidden = true;
        legendPanel.hidden = true;
        showSelection("关于这张地图", "数据来自家族办公室知识库，光点代表已解析坐标的城市。 ");
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest(".side-rail, .search-panel, .legend-panel, .selection, .map-tools")) return;
        closeFloatingPanels();
      });

      searchInput.addEventListener("input", (event) => renderSearchResults(event.target.value));

      function renderSearchResults(query) {
        const normalizedQuery = query.trim().toLowerCase();
        const matches = offices
          .filter((point) => !normalizedQuery || `${point.city} ${point.country}`.toLowerCase().includes(normalizedQuery))
          .slice(0, 8);

        if (!matches.length) {
          searchResults.innerHTML = '<div class="search-empty">没有找到匹配的城市或国家</div>';
          return;
        }

        searchResults.innerHTML = matches.map((point, index) => `
          <button class="search-result" data-result-index="${index}">
            <span>${point.city}</span>
            <small>${point.country || "全球"} · ${point.count} 家</small>
          </button>
        `).join("");

        searchResults.querySelectorAll(".search-result").forEach((button) => {
          button.addEventListener("click", () => {
            const point = matches[Number(button.dataset.resultIndex)];
            searchPanel.hidden = true;
            handleOfficeClick(point);
          });
        });
      }

      function getGeometryCoordinates(geometry) {
        const coordinates = [];

        function visit(value) {
          if (!Array.isArray(value)) return;
          if (typeof value[0] === "number" && typeof value[1] === "number") {
            coordinates.push([value[0], value[1]]);
            return;
          }
          value.forEach(visit);
        }

        visit(geometry?.coordinates);
        return coordinates;
      }

      function normalizeLongitude(lng) {
        return ((lng + 540) % 360) - 180;
      }

      function getCircularLongitudeRange(coordinates) {
        if (!coordinates.length) return { span: 0, center: 0 };

        const longitudes = coordinates
          .map(([lng]) => (lng + 360) % 360)
          .sort((a, b) => a - b);
        let largestGap = -1;
        let largestGapIndex = 0;

        for (let index = 0; index < longitudes.length; index += 1) {
          const next = index === longitudes.length - 1
            ? longitudes[0] + 360
            : longitudes[index + 1];
          const gap = next - longitudes[index];
          if (gap > largestGap) {
            largestGap = gap;
            largestGapIndex = index;
          }
        }

        const start = longitudes[(largestGapIndex + 1) % longitudes.length];
        const span = Math.min(360, 360 - largestGap);
        return {
          span,
          center: normalizeLongitude(start + span / 2)
        };
      }

      function getCountryView(polygon) {
        const properties = polygon.properties || {};
        const coordinates = getGeometryCoordinates(polygon.geometry);
        const bounds = getGeometryBounds(polygon.geometry);

        if (!bounds || !coordinates.length) {
          return { lat: 0, lng: 0, altitude: 0.65 };
        }

        const longitudeRange = getCircularLongitudeRange(coordinates);
        const latitudeSpan = bounds.maxLat - bounds.minLat;
        const longitudeSpan = longitudeRange.span;
        const geometryLat = (bounds.minLat + bounds.maxLat) / 2;
        const geometryLng = longitudeRange.center;
        const labelLat = Number(properties.LABEL_Y);
        const labelLng = Number(properties.LABEL_X);
        const hasLabelPoint = properties.LABEL_Y != null && properties.LABEL_X != null &&
          Number.isFinite(labelLat) && Number.isFinite(labelLng);
        const labelLngOffset = hasLabelPoint
          ? Math.abs(((normalizeLongitude(labelLng) - geometryLng + 540) % 360) - 180)
          : Infinity;
        const useLabelPoint = hasLabelPoint &&
          labelLngOffset <= Math.max(12, longitudeSpan * 0.25) &&
          Math.abs(labelLat - geometryLat) <= Math.max(8, latitudeSpan * 0.25);
        const lat = useLabelPoint ? labelLat : geometryLat;
        const lng = useLabelPoint ? normalizeLongitude(labelLng) : geometryLng;
        const longitudeAtLatitude = longitudeSpan * Math.max(0.25, Math.cos(lat * Math.PI / 180));
        const countrySpan = Math.max(latitudeSpan, longitudeAtLatitude);
        const narrowViewportFactor = Math.max(1, (globeContainer.clientHeight || 1) / (globeContainer.clientWidth || 1));
        // Reserve room around the full country bounds so the globe does not crop them.
        const fitRatio = countrySpan / 32;
        const altitude = Math.min(
          1.25,
          Math.max(0.12, 0.12 + 0.58 * Math.pow(fitRatio, 1.15) * narrowViewportFactor)
        );

        return { lat, lng, altitude };
      }

      function getGeometryBounds(geometry) {
        const coordinates = getGeometryCoordinates(geometry);

        if (!coordinates?.length) return null;

        return coordinates.reduce(
          (bounds, [lng, lat]) => ({
            minLng: Math.min(bounds.minLng, lng),
            maxLng: Math.max(bounds.maxLng, lng),
            minLat: Math.min(bounds.minLat, lat),
            maxLat: Math.max(bounds.maxLat, lat)
          }),
          { minLng: Infinity, maxLng: -Infinity, minLat: Infinity, maxLat: -Infinity }
        );
      }

      countries = window.COUNTRIES_GEOJSON;
      globe.polygonsData(countries.features);
    </script>
  </body>
</html>
