<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      :root {
        --ink: #0d0e10;
        --rail: rgba(29, 30, 32, .7);
        --panel: rgba(29, 30, 32, .68);
        --line: rgba(255, 255, 255, .16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, .58);
        --soft: rgba(245, 245, 245, .1);
        --accent: #f5f5f5;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: -apple-system, "SF UI Text", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      button, input { font: inherit; }
      button { color: inherit; }
      #globe { width: 100%; height: 100%; touch-action: none; }

      .side-rail { position: fixed; z-index: 5; left: 50%; bottom: 18px; width: auto; height: 54px; display: flex; align-items: center; transform: translateX(-50%); background: var(--rail); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.28); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .rail-brand { display: none; }
      .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.72); color: var(--accent); border-radius: 8px; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .rail-group { display: flex; align-items: center; padding: 4px; }
      .tool-button { position: relative; width: 44px; height: 44px; margin: 0 2px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; opacity: .68; transition: opacity .2s, background .2s, color .2s; }
      .tool-button:hover, .tool-button.active { color: var(--accent); opacity: 1; background: rgba(255,255,255,.12); border-radius: 9px; }
      .tool-button.active::before { content: ""; position: absolute; bottom: -5px; width: 18px; height: 2px; border-radius: 2px; background: var(--accent); }
      .tool-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .tool-button .tool-label { position: absolute; left: 50%; bottom: 52px; display: none; transform: translateX(-50%); white-space: nowrap; padding: 7px 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .tool-button:hover .tool-label { display: block; }

      .live-status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .live-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.15); }

      .map-tools { position: fixed; z-index: 4; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
      .map-tool { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: rgba(17,18,20,.66); color: rgba(255,255,255,.82); cursor: pointer; font-size: 18px; line-height: 1; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .map-tool:hover { color: var(--accent); border-color: rgba(255,255,255,.7); }
      .map-tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      .search-panel { position: fixed; z-index: 6; left: 50%; bottom: 88px; top: auto; width: min(360px, calc(100vw - 40px)); transform: translateX(-50%); padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .search-panel[hidden], .filter-panel[hidden], .stats-panel[hidden] { display: none; }
      .search-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .search-input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: 0; background: rgba(0,0,0,.2); color: var(--text); font-size: 13px; }
      .search-input:focus { border-color: rgba(255,255,255,.72); }
      .search-results { margin-top: 8px; max-height: 220px; overflow: auto; }
      .search-result { width: 100%; padding: 9px 8px; display: flex; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid rgba(255,255,255,.08); border-radius: 7px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
      .search-result:hover { background: rgba(255,255,255,.1); }
      .search-result small { color: var(--muted); font-size: 11px; }
      .search-empty { padding: 12px 8px; color: var(--muted); font-size: 12px; }

      .filter-panel, .stats-panel { position: fixed; z-index: 4; left: 50%; bottom: 88px; transform: translateX(-50%); width: min(300px, calc(100vw - 40px)); padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .panel-kicker { margin-bottom: 12px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .filter-field { display: block; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
      .filter-select { width: 100%; height: 36px; margin-top: 7px; padding: 0 9px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: 0; background: rgba(0,0,0,.2); color: var(--text); font-size: 13px; }
      .filter-select:focus { border-color: rgba(255,255,255,.72); }
      .filter-check { display: flex; align-items: center; gap: 8px; color: rgba(244,244,241,.78); font-size: 12px; cursor: pointer; }
      .filter-check input { accent-color: var(--accent); }
      .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.1); }
      .filter-count { color: var(--muted); font-size: 11px; }
      .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .stat-item { min-width: 0; padding: 9px 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: rgba(255,255,255,.045); }
      .stat-item strong { display: block; color: var(--text); font-size: 17px; font-weight: 500; }
      .stat-item span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; white-space: nowrap; }
      .stats-title { margin: 14px 0 7px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
      .top-city { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.08); color: rgba(244,244,241,.82); font-size: 12px; }
      .top-city:last-child { border-bottom: 0; }
      .top-city small { color: var(--muted); font-size: 11px; }

      .selection { position: fixed; z-index: 4; left: 50%; bottom: 88px; width: min(350px, calc(100vw - 40px)); transform: translateX(-50%); display: none; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .selection.visible { display: block; }
      .selection-kicker { color: var(--accent); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .selection strong { display: block; margin: 7px 0 4px; color: var(--text); font-size: 21px; font-weight: 500; }
      .selection p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .selection-meta { display: flex; gap: 16px; margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.1); color: var(--muted); font-size: 11px; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      .action-button { height: 30px; padding: 0 11px; border: 1px solid rgba(255,255,255,.56); border-radius: 8px; background: rgba(255,255,255,.06); color: var(--accent); cursor: pointer; font-size: 12px; }
      .action-button:hover { background: rgba(255,255,255,.14); }
      .map-status { position: fixed; z-index: 3; left: 50%; bottom: 78px; transform: translateX(-50%); color: rgba(255,255,255,.45); font-size: 11px; pointer-events: none; }

      .knowledge-reader { position: fixed; z-index: 20; inset: 0; display: grid; grid-template-rows: 58px 1fr; background: #111315; color: #eceeea; overflow: hidden; }
      .knowledge-reader[hidden] { display: none; }
      .knowledge-topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.12); background: rgba(17,19,21,.94); }
      .knowledge-topbar-title { min-width: 0; overflow: hidden; color: rgba(236,238,234,.68); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .knowledge-close { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; background: rgba(255,255,255,.06); color: #f4f5f1; cursor: pointer; font-size: 20px; line-height: 1; }
      .knowledge-close:hover { background: rgba(255,255,255,.14); }
      .knowledge-progress { position: absolute; z-index: 1; top: 57px; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,.08); }
      .knowledge-progress span { display: block; width: 0; height: 100%; background: #e5e7e2; transition: width .15s ease-out; }
      .knowledge-layout { min-height: 0; display: grid; grid-template-columns: 210px minmax(0, 760px) 230px; justify-content: center; gap: 38px; padding: 42px 30px 70px; overflow: auto; scrollbar-color: rgba(255,255,255,.25) transparent; }
      .knowledge-toc { position: sticky; top: 0; align-self: start; max-height: calc(100vh - 130px); overflow: auto; padding: 4px 0; }
      .knowledge-toc-title { margin-bottom: 12px; color: rgba(236,238,234,.45); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
      .knowledge-toc a { display: block; padding: 6px 9px; border-left: 1px solid rgba(255,255,255,.12); color: rgba(236,238,234,.56); font-size: 12px; line-height: 1.35; text-decoration: none; }
      .knowledge-toc a:hover, .knowledge-toc a.active { border-left-color: #eceeea; color: #f4f5f1; background: rgba(255,255,255,.05); }
      .knowledge-toc a.depth-3 { padding-left: 20px; font-size: 11px; }
      .knowledge-article { min-width: 0; }
      .knowledge-hero { padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,.12); }
      .knowledge-eyebrow { color: rgba(236,238,234,.46); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
      .knowledge-hero h1 { max-width: 700px; margin: 12px 0 10px; color: #f4f5f1; font-size: clamp(30px, 4vw, 52px); font-weight: 500; line-height: 1.08; letter-spacing: 0; }
      .knowledge-meta { display: flex; flex-wrap: wrap; gap: 7px 16px; color: rgba(236,238,234,.58); font-size: 12px; }
      .knowledge-summary { margin: 24px 0 0; color: rgba(236,238,234,.82); font-size: 16px; line-height: 1.8; }
      .knowledge-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
      .knowledge-tag { padding: 5px 9px; border: 1px solid rgba(255,255,255,.17); border-radius: 999px; color: rgba(236,238,234,.7); font-size: 11px; }
      .knowledge-section { padding: 34px 0 0; scroll-margin-top: 24px; }
      .knowledge-section h2 { margin: 0 0 17px; color: #f2f3ef; font-size: 24px; font-weight: 500; line-height: 1.25; }
      .knowledge-section h3 { margin: 26px 0 10px; color: rgba(242,243,239,.9); font-size: 16px; font-weight: 500; }
      .knowledge-paragraph { margin: 0 0 14px; color: rgba(236,238,234,.78); font-size: 15px; line-height: 1.85; }
      .knowledge-image { margin: 20px 0; overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: #1a1d20; }
      .knowledge-image img { display: block; width: 100%; max-height: 340px; object-fit: cover; opacity: .92; }
      .knowledge-image.image-unavailable { min-height: 78px; display: grid; align-content: center; background: #1b1e21; }
      .knowledge-image.image-unavailable::before { content: "资料图片暂不可用"; display: block; padding: 14px 12px 0; color: rgba(236,238,234,.38); font-size: 12px; }
      .knowledge-image figcaption { padding: 9px 12px; color: rgba(236,238,234,.48); font-size: 11px; }
      .knowledge-fact-table, .knowledge-comparison { width: 100%; border-collapse: collapse; margin: 15px 0 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); font-size: 13px; }
      .knowledge-fact-table th, .knowledge-fact-table td, .knowledge-comparison th, .knowledge-comparison td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: left; vertical-align: top; }
      .knowledge-fact-table tr:last-child td, .knowledge-comparison tr:last-child td { border-bottom: 0; }
      .knowledge-fact-table th, .knowledge-comparison th { width: 34%; color: rgba(236,238,234,.5); background: rgba(255,255,255,.04); font-weight: 400; }
      .knowledge-fact-table td, .knowledge-comparison td { color: rgba(236,238,234,.82); line-height: 1.55; }
      .knowledge-insight, .knowledge-risk { margin: 19px 0; padding: 15px 17px; border-left: 2px solid rgba(236,238,234,.72); background: rgba(255,255,255,.055); }
      .knowledge-risk { border-left-color: rgba(210,170,130,.9); background: rgba(130,93,62,.13); }
      .knowledge-callout-label { margin-bottom: 6px; color: rgba(236,238,234,.52); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .knowledge-insight p, .knowledge-risk p { margin: 0; color: rgba(236,238,234,.82); font-size: 14px; line-height: 1.7; }
      .knowledge-timeline { position: relative; margin: 18px 0 4px 7px; padding-left: 22px; border-left: 1px solid rgba(255,255,255,.22); }
      .knowledge-timeline-item { position: relative; padding: 0 0 20px; }
      .knowledge-timeline-item::before { content: ""; position: absolute; top: 5px; left: -27px; width: 8px; height: 8px; border: 2px solid #e8eae6; border-radius: 50%; background: #111315; }
      .knowledge-timeline-item strong { display: block; margin-bottom: 4px; color: rgba(244,245,241,.9); font-size: 13px; font-weight: 500; }
      .knowledge-timeline-item span { color: rgba(236,238,234,.68); font-size: 13px; line-height: 1.6; }
      .knowledge-network { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 18px 0; }
      .knowledge-network-node { min-height: 54px; display: grid; place-items: center; padding: 9px; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(255,255,255,.045); color: rgba(236,238,234,.78); font-size: 11px; line-height: 1.35; text-align: center; }
      .knowledge-network-node.primary { grid-column: 1 / -1; border-color: rgba(255,255,255,.42); color: #f3f4f0; }
      .knowledge-source-list { margin: 0; padding-left: 20px; color: rgba(236,238,234,.64); font-size: 12px; line-height: 1.7; }
      .knowledge-source-list a { color: rgba(236,238,234,.84); }
      .knowledge-aside { position: sticky; top: 0; align-self: start; }
      .knowledge-aside-block { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
      .knowledge-aside-label { margin-bottom: 8px; color: rgba(236,238,234,.42); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .knowledge-aside-value { color: rgba(236,238,234,.82); font-size: 13px; line-height: 1.6; }
      .knowledge-reading-label { color: rgba(236,238,234,.5); font-size: 11px; }

      @media (max-width: 600px) {
        .side-rail { bottom: 12px; }
        .search-panel, .selection { bottom: 80px; width: calc(100vw - 24px); }
        .map-tools { right: 12px; bottom: 88px; }
        .filter-panel, .stats-panel { bottom: 80px; width: calc(100vw - 24px); }
        .map-status { display: none; }
        .knowledge-topbar { height: 52px; padding: 0 14px; }
        .knowledge-progress { top: 51px; }
        .knowledge-layout { display: block; padding: 25px 18px 46px; }
        .knowledge-toc { position: static; max-height: none; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.12); }
        .knowledge-toc-title { margin-bottom: 8px; }
        .knowledge-toc a { display: inline-block; margin: 0 5px 5px 0; padding: 5px 8px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; font-size: 11px; }
        .knowledge-toc a.depth-3 { padding-left: 8px; font-size: 11px; }
        .knowledge-hero h1 { font-size: 34px; }
        .knowledge-summary { font-size: 14px; line-height: 1.75; }
        .knowledge-section { padding-top: 28px; }
        .knowledge-section h2 { font-size: 21px; }
        .knowledge-paragraph { font-size: 14px; line-height: 1.8; }
        .knowledge-aside { display: none; }
        .knowledge-network { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

    </style>
  </head>
  <body>
    <div id="globe"></div>
    <aside class="side-rail" aria-label="地图工具">
      <div class="rail-brand"><span class="brand-mark">FO</span></div>
      <div class="rail-group">
        <button class="tool-button active" id="overview" title="总览" aria-label="总览">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.1 2.3 3.2 5.1 3.2 8.5s-1.1 6.2-3.2 8.5c-2.1-2.3-3.2-5.1-3.2-8.5S9.9 5.8 12 3.5Z"/></svg>
          <span class="tool-label">总览</span>
        </button>
        <button class="tool-button" id="search-toggle" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.4 15.4 5 5"/></svg>
          <span class="tool-label">搜索</span>
        </button>
        <button class="tool-button" id="filter-toggle" title="筛选" aria-label="筛选">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span class="tool-label">筛选</span>
        </button>
        <button class="tool-button" id="stats-toggle" title="数据" aria-label="数据">
          <svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>
          <span class="tool-label">数据</span>
        </button>
      </div>
    </aside>
    <div class="search-panel" id="search-panel" hidden>
      <label class="search-label" for="search-input">搜索城市或国家</label>
      <input class="search-input" id="search-input" type="search" placeholder="例如：伦敦、美国" autocomplete="off" />
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="filter-panel" id="filter-panel" hidden>
      <div class="panel-kicker">筛选点位</div>
      <label class="filter-field" for="country-filter">国家 / 地区
        <select class="filter-select" id="country-filter">
          <option value="all">全部国家 / 地区</option>
        </select>
      </label>
      <label class="filter-check" for="major-cities-filter">
        <input id="major-cities-filter" type="checkbox" />
        只看重点城市（5 家以上）
      </label>
      <div class="filter-footer">
        <span class="filter-count" id="filter-count">显示全部城市</span>
        <button class="action-button" id="clear-filter" type="button">清除筛选</button>
      </div>
    </div>
    <div class="stats-panel" id="stats-panel" hidden>
      <div class="panel-kicker">数据概览</div>
      <div class="stats-grid">
        <div class="stat-item"><strong id="total-offices">0</strong><span>家族办公室</span></div>
        <div class="stat-item"><strong id="total-cities">0</strong><span>城市</span></div>
        <div class="stat-item"><strong id="total-countries">0</strong><span>国家 / 地区</span></div>
      </div>
      <div class="stats-title">城市分布</div>
      <div id="top-cities"></div>
    </div>
    <div class="map-tools" aria-label="地图控制">
      <button class="map-tool" id="zoom-in" title="放大" aria-label="放大">+</button>
      <button class="map-tool" id="zoom-out" title="缩小" aria-label="缩小">−</button>
      <button class="map-tool" id="reset-view" title="复位视角" aria-label="复位视角">
        <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 5.5v4h4"/></svg>
      </button>
    </div>
    <div id="selection" class="selection">
      <div class="selection-kicker">Selected region</div>
      <strong id="selected-name"></strong>
      <p id="selected-description"></p>
      <div class="selection-meta"><span>地图数据</span><span>知识库同步</span></div>
      <div class="actions"><button class="action-button" id="back">返回全球视角</button><button class="action-button" id="read-knowledge" hidden>查看深度研究</button></div>
    </div>
    <div class="map-status" id="map-status">拖动旋转 · 滚轮缩放 · 点击国家查看</div>
    <section class="knowledge-reader" id="knowledge-reader" hidden aria-label="家办知识库文章">
      <div class="knowledge-topbar">
        <div class="knowledge-topbar-title" id="knowledge-topbar-title">家族办公室深度研究</div>
        <button class="knowledge-close" id="knowledge-close" type="button" title="关闭文章" aria-label="关闭文章">×</button>
      </div>
      <div class="knowledge-progress" aria-hidden="true"><span id="knowledge-progress-bar"></span></div>
      <div class="knowledge-layout">
        <nav class="knowledge-toc" id="knowledge-toc" aria-label="文章目录"></nav>
        <article class="knowledge-article" id="knowledge-article"></article>
        <aside class="knowledge-aside" id="knowledge-aside"></aside>
      </div>
    </section>
    <script src="vendor/globe.gl.min.js"></script>
    <script src="data/countries.js"></script>
    <script src="data/family-office-locations.js"></script>
    <script>
      const globeContainer = document.getElementById("globe");
      const selection = document.getElementById("selection");
      const selectedName = document.getElementById("selected-name");
      const selectedDescription = document.getElementById("selected-description");
      const readKnowledge = document.getElementById("read-knowledge");
      const mapStatus = document.getElementById("map-status");
      const searchPanel = document.getElementById("search-panel");
      const searchInput = document.getElementById("search-input");
      const searchResults = document.getElementById("search-results");
      const filterPanel = document.getElementById("filter-panel");
      const statsPanel = document.getElementById("stats-panel");
      const countryFilter = document.getElementById("country-filter");
      const majorCitiesFilter = document.getElementById("major-cities-filter");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")

          .replaceAll("'", "&#039;");

      function renderKnowledgeBlock(block) {
        if (block.type === "paragraph") return `<p class="knowledge-paragraph">${escapeHtml(block.text)}</p>`;
        if (block.type === "heading") return `<h3>${escapeHtml(block.title)}</h3>`;
        if (block.type === "image") return `<figure class="knowledge-image"><img src="${escapeHtml(block.src)}" alt="${escapeHtml(block.alt)}" loading="lazy" onerror="this.closest('figure').classList.add('image-unavailable'); this.remove();" /><figcaption>${escapeHtml(block.caption || block.alt)}</figcaption></figure>`;
        if (block.type === "factTable") return `<table class="knowledge-fact-table"><tbody>${block.rows.map(([key, value]) => `<tr><th>${escapeHtml(key)}</th><td>${escapeHtml(value)}</td></tr>`).join("")}</tbody></table>`;
        if (block.type === "comparison") return `<table class="knowledge-comparison"><thead><tr>${block.columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}</tr></thead><tbody>${block.rows.map((row) => `<tr>${row.map((value) => `<td>${escapeHtml(value)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
        if (block.type === "insight" || block.type === "risk") return `<aside class="knowledge-${block.type}"><div class="knowledge-callout-label">${escapeHtml(block.label)}</div><p>${escapeHtml(block.text)}</p></aside>`;
        if (block.type === "timeline") return `<div class="knowledge-timeline">${block.items.map(([year, text]) => `<div class="knowledge-timeline-item"><strong>${escapeHtml(year)}</strong><span>${escapeHtml(text)}</span></div>`).join("")}</div>`;

      function getGeometryCoordinates(geometry) {
        const coordinates = [];

        function visit(value) {
          if (!Array.isArray(value)) return;
          if (typeof value[0] === "number" && typeof value[1] === "number") {
            coordinates.push([value[0], value[1]]);
            return;
          }
          value.forEach(visit);
        }

        visit(geometry?.coordinates);
        return coordinates;
      }

      function normalizeLongitude(lng) {
        return ((lng + 540) % 360) - 180;
      }

      function getCircularLongitudeRange(coordinates) {
        if (!coordinates.length) return { span: 0, center: 0 };

        const longitudes = coordinates
          .map(([lng]) => (lng + 360) % 360)
          .sort((a, b) => a - b);
        let largestGap = -1;
        let largestGapIndex = 0;

        for (let index = 0; index < longitudes.length; index += 1) {
          const next = index === longitudes.length - 1
            ? longitudes[0] + 360
            : longitudes[index + 1];
          const gap = next - longitudes[index];
          if (gap > largestGap) {
            largestGap = gap;
            largestGapIndex = index;
          }
        }

        const start = longitudes[(largestGapIndex + 1) % longitudes.length];
        const span = Math.min(360, 360 - largestGap);
        return {
          span,
          center: normalizeLongitude(start + span / 2)
        };
      }

      function getCountryView(polygon) {
        const properties = polygon.properties || {};
        const coordinates = getGeometryCoordinates(polygon.geometry);
        const bounds = getGeometryBounds(polygon.geometry);

        if (!bounds || !coordinates.length) {
          return { lat: 0, lng: 0, altitude: 0.65 };
        }

        const longitudeRange = getCircularLongitudeRange(coordinates);
        const latitudeSpan = bounds.maxLat - bounds.minLat;
        const longitudeSpan = longitudeRange.span;
        const geometryLat = (bounds.minLat + bounds.maxLat) / 2;
        const geometryLng = longitudeRange.center;
        const labelLat = Number(properties.LABEL_Y);
        const labelLng = Number(properties.LABEL_X);
        const hasLabelPoint = properties.LABEL_Y != null && properties.LABEL_X != null &&
          Number.isFinite(labelLat) && Number.isFinite(labelLng);
        const labelLngOffset = hasLabelPoint
          ? Math.abs(((normalizeLongitude(labelLng) - geometryLng + 540) % 360) - 180)
          : Infinity;
        const useLabelPoint = hasLabelPoint &&
          labelLngOffset <= Math.max(12, longitudeSpan * 0.25) &&
          Math.abs(labelLat - geometryLat) <= Math.max(8, latitudeSpan * 0.25);
        const lat = useLabelPoint ? labelLat : geometryLat;
        const lng = useLabelPoint ? normalizeLongitude(labelLng) : geometryLng;
        const longitudeAtLatitude = longitudeSpan * Math.max(0.25, Math.cos(lat * Math.PI / 180));
        const countrySpan = Math.max(latitudeSpan, longitudeAtLatitude);
        const narrowViewportFactor = Math.max(1, (globeContainer.clientHeight || 1) / (globeContainer.clientWidth || 1));
        // Reserve room around the full country bounds so the globe does not crop them.
        const fitRatio = countrySpan / 32;
        const altitude = Math.min(
          1.25,
          Math.max(0.12, 0.12 + 0.58 * Math.pow(fitRatio, 1.15) * narrowViewportFactor)
        );

        return { lat, lng, altitude };
      }

      function getGeometryBounds(geometry) {
        const coordinates = getGeometryCoordinates(geometry);

        if (!coordinates?.length) return null;

        return coordinates.reduce(
          (bounds, [lng, lat]) => ({
            minLng: Math.min(bounds.minLng, lng),
            maxLng: Math.max(bounds.maxLng, lng),
            minLat: Math.min(bounds.minLat, lat),
            maxLat: Math.max(bounds.maxLat, lat)
          }),
          { minLng: Infinity, maxLng: -Infinity, minLat: Infinity, maxLat: -Infinity }
        );
      }

      countries = window.COUNTRIES_GEOJSON;
      globe.polygonsData(countries.features);
      populatePanels();
    </script>
  </body>
</html>
